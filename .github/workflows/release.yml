name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: node18-win-x64
            artifact: cursor-i18n-tool-win-x64.exe
          - os: macos-latest
            target: node18-macos-x64
            artifact: cursor-i18n-tool-macos-x64
          - os: macos-latest
            target: node18-macos-arm64
            artifact: cursor-i18n-tool-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install

      - name: Build executable
        run: npx pkg . --out-path dist --targets ${{ matrix.target }} --no-bytecode --public-packages "*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/cursor-i18n-tool-win-x64.exe/cursor-i18n-tool-win-x64.exe
            artifacts/cursor-i18n-tool-macos-x64/cursor-i18n-tool-macos-x64
            artifacts/cursor-i18n-tool-macos-arm64/cursor-i18n-tool-macos-arm64
