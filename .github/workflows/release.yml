name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: node18-win-x64
            artifact: win-x64
          - os: macos-latest
            target: node18-macos-x64
            artifact: macos-x64
          - os: macos-latest
            target: node18-macos-arm64
            artifact: macos-arm64
          - os: ubuntu-latest
            target: node18-linux-x64
            artifact: linux-x64
          - os: ubuntu-latest
            target: node18-linux-arm64
            artifact: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install

      - name: Build executable
        run: npx pkg . --out-path dist --targets ${{ matrix.target }} --no-bytecode --public-packages "*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/win-x64/*
            artifacts/macos-x64/*
            artifacts/macos-arm64/*
            artifacts/linux-x64/*
            artifacts/linux-arm64/*
